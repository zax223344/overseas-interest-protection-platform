<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>onclick 语法测试</title>
<style>
body{background:#0a1525;color:#fff;font-family:sans-serif;padding:20px}
.btn{padding:12px 24px;background:#0066ff;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:8px;font-size:16px;display:block}
#result{margin-top:20px;padding:16px;background:#000;border-radius:8px;font-family:monospace}
</style>
</head>
<body>
<h2>测试 onclick="try{...}catch(e){}" 语法</h2>
<button class="btn" onclick="try{navigateTo('situation')}catch(e){alert('错误: '+e.message)}">测试按钮（try-catch 语法）</button>
<button class="btn" onclick="navigateTo('situation')">测试按钮（直接调用）</button>
<div id="result">等待点击...</div>
<script>
function navigateTo(v){
  document.getElementById('result').innerHTML='✓ navigateTo 被调用: '+v+'<br>时间: '+new Date().toLocaleTimeString();
}
</script>
</body>
</html>
