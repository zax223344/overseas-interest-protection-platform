name: hourly-collect
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install minimal deps
        run: cd server && npm install --no-save --no-audit --no-fund pg https-proxy-agent
      - name: Run collector
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OVERSEAS_PROXY: direct
        run: cd server && node action-collect.js
